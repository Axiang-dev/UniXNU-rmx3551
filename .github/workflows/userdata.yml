name: RMX3551 userdata image

# Builds the 19 GiB SHNGROOT userdata image the NativeUfs transport reads as the
# root, from the pinned 22H374 restore.  This is the macOS-only half of stage 6:
# the restore is attached with hdiutil/diskutil and two AEA payloads are
# decrypted, so it cannot run on the Windows host that flashes the phone.
#
# The image is written as parts because GitHub caps one release asset at 2 GiB.
# Each part is published as a release asset, so the download needs no token and
# can be resumed.
on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'iPadOS 18.7.10 / 22H374 restore URL'
        required: false
        default: 'https://updates.cdn-apple.com/2026WinterFCS/fullrestores/140-97955/A3F72236-89AD-47C5-8394-5E824079C175/iPad_10.2_18.7.10_22H374_Restore.ipsw'
      release_tag:
        description: 'Release tag that receives the parts'
        required: false
        default: 'userdata-22H374'

permissions:
  contents: write

jobs:
  userdata:
    runs-on: macos-15-intel
    timeout-minutes: 300
    env:
      PONG_WORK_ROOT: ${{ github.workspace }}/pong-work
      PONG_ROOT: ${{ github.workspace }}/pong-work
      PONG_INPUT_ROOT: ${{ github.workspace }}/pong-inputs
      IPSW_URL: ${{ inputs.ipsw_url }}
    steps:
      - name: Checkout device repo with driver submodules
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
          fetch-depth: 1

      - name: Reclaim disk
        # Peak is about 45 GiB: the 7.4 GiB download, the expanded restore, two
        # AEA decryptions, a 5 GiB SystemOS and 8 GiB Data volume, the 10 GiB
        # rebuilt root next to the 6.4 GiB original, and the final image.  The
        # IPSW working tree is deleted as soon as the userland exists, and the
        # runner's unused Xcode copies are what buys the rest of the room.
        run: |
          set -euo pipefail
          selected="$(xcode-select -p)"
          echo "xcode-select: ${selected}"
          need=$((70 * 1024 * 1024))
          avail="$(df -k / | awk 'NR==2 {print $4}')"
          echo "avail_kb=${avail} need_kb=${need}"
          if [ "$avail" -lt "$need" ]; then
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              case "$selected" in
                "$app"/*) echo "keep $app" ;;
                *) echo "remove $app"; sudo rm -rf "$app" ;;
              esac
            done
          fi
          sudo rm -rf /Library/Developer/CoreSimulator/Caches /Library/Developer/CoreSimulator/Devices || true
          df -h

      - name: Tools
        run: |
          set -euo pipefail
          for t in hdiutil diskutil aea python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; exit 1; }
          done
          sudo -n true || { echo 'the userland chain needs passwordless sudo'; exit 1; }
          # decrypt-ipados18-aea.py speaks HPKE to unwrap the AEA content keys.
          # Homebrew's python3 is externally managed and refuses pip, so the
          # dependency lives in a venv that goes first on PATH: every later step
          # (and the sys.executable subprocesses the prepare script spawns) then
          # sees pyhpke.
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --upgrade pip
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet pyhpke
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/venv/bin/python3" -c 'import pyhpke, sys; print("pyhpke ready", sys.version.split()[0])'

      - name: Prepared userland from the IPSW
        # Attaches the restore, decrypts the two AEA payloads and writes the
        # OS/SystemOS/Data containers plus the volume layout with real UUIDs.
        timeout-minutes: 180
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/pong-userland" "${RUNNER_TEMP}/pong-ipsw-work"
          python3 device/scripts/prepare-pong-userland-from-ipsw.py \
            --ipsw-url "${IPSW_URL}" \
            --work-dir "${RUNNER_TEMP}/pong-ipsw-work" \
            --out "${RUNNER_TEMP}/pong-userland" \
            --developer "$(xcode-select -p)" \
            --json-out ci-userland-from-ipsw.json \
            --volume-layout-out ci-volume-layout.json \
            --jobs 4
          echo "${RUNNER_TEMP}/pong-userland" > ci-userland-path.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          layout = json.loads(Path('ci-volume-layout.json').read_text())
          report = json.loads(Path('ci-userland-from-ipsw.json').read_text())
          if layout.get('ci_placeholder'):
              raise SystemExit('ci-volume-layout.json still holds placeholders')
          for key in ('os', 'systemos', 'data'):
              if len(layout.get(key, {}).get('uuid', '')) != 36:
                  raise SystemExit('ci-volume-layout.json has no usable %s uuid' % key)
          if report.get('build') != '22H374':
              raise SystemExit('the userland report names build %r' % report.get('build'))
          print('userland bytes', report['userland_bytes'], 'in', report['seconds'], 'seconds')
          for name in ('os', 'systemos', 'data'):
              print(' ', name, layout[name]['uuid'])
          PY
          # The restore download and its expansion are ~15 GiB and nothing after
          # this step reads them; the rebuilt root needs the room.
          rm -rf "${RUNNER_TEMP}/pong-ipsw-work"
          df -h

      - name: Prepare the OS root for launchd
        # launchd verifies /System/Library/xpc/launchd.plist against its detached
        # signature before it reads a single job, and a copy of the root that is
        # not the sealed system volume can never satisfy that check: the panic
        # log shows it mapping 112 cache segments and then aborting with -67062
        # errSecCSUnsigned.  The step also bridges the usr trees the split
        # userland keeps in the cryptex (execvp /usr/libexec/xpcproxy otherwise
        # fails with ENOENT).  Both edits are metadata only, so the container
        # keeps its size and the windows after it keep their offsets.
        timeout-minutes: 60
        run: |
          set -euo pipefail
          prepared="$(cat ci-userland-path.txt)"
          python3 device/scripts/prepare-os-root.py \
            --root "${prepared}/pong-ipados18-system.cdr" \
            --cryptex "${prepared}/pong-ipados18-systemos.cdr" \
            --work "${RUNNER_TEMP}/os-root" \
            --report ci-os-root.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('ci-os-root.json').read_text())
          if 'System/Library/xpc/launchd.plist.sig' not in report['moved']:
              raise SystemExit('launchd.plist.sig is still in the image; launchd will abort')
          if report['rebuilt_bytes'] != report['original_bytes']:
              raise SystemExit('the root changed size; the windows after it would move')
          print('root bytes', report['original_bytes'], 'links', report['links'])
          print('moved out:', ', '.join(report['moved']))
          print('aliases:', ', '.join(report['aliases']))
          PY
          df -h

      - name: SHNGROOT directory
        # Hashes every byte of roughly 19 GiB; this is the disk-bound half.
        timeout-minutes: 150
        run: |
          set -euo pipefail
          prepared="$(cat ci-userland-path.txt)"
          mkdir -p out/ipados18/ufs
          python3 device/scripts/prepare-ipados18-ufs-layout.py \
            --userland "${prepared}" \
            --systemos "${prepared}/pong-ipados18-systemos.cdr" \
            --volume-layout ci-volume-layout.json \
            --output-dir out/ipados18/ufs
          python3 - <<'PY'
          import json
          from pathlib import Path
          header = Path('out/ipados18/ufs/shngroot-ipados18.bin').read_bytes()
          layout = json.loads(Path('out/ipados18/ufs/ufs-layout.json').read_text())
          names = [window['name'] for window in layout['windows']]
          if header[:8] != b'SHNGROOT' or len(header) != 4096:
              raise SystemExit('the SHNGROOT header is not a 4096-byte directory')
          if names != ['OS', 'SystemOS', 'Data']:
              raise SystemExit('layout windows are %s, not OS/SystemOS/Data' % names)
          print('SHNGROOT directory', len(header), 'bytes for', ', '.join(names))
          PY
          df -h

      - name: OS window parts
        # The root is the only window that changes between bring-up builds and it
        # comes first, so this prefix (header + pad + OS window) is byte for byte
        # what a full flash writes over userdata.  Flashing just this replaces the
        # root and leaves SystemOS and Data where the previous flash put them.
        # It has to run before the full parts, which consume the source windows.
        run: |
          set -euo pipefail
          python3 device/scripts/build-oswindow-parts.py \
            --header out/ipados18/ufs/shngroot-ipados18.bin \
            --layout out/ipados18/ufs/ufs-layout.json \
            --output-dir out/ipados18/ufs \
            --part-mib 1900 \
            --json-out oswindow-image.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          image = json.loads(Path('oswindow-image.json').read_text())
          os_bytes = image['os_window_bytes']
          if not 4 * 1024 ** 3 < os_bytes < 16 * 1024 ** 3:
              raise SystemExit('the OS window is %d bytes; that is not a root' % os_bytes)
          print('os window', os_bytes, 'bytes, prefix', image['image_bytes'],
                'in', len(image['parts']), 'part(s)')
          PY
          df -h

      - name: Userdata image parts
        # 1900 MiB parts keep every release asset under the 2 GiB upload limit.
        timeout-minutes: 180
        run: |
          set -euo pipefail
          prepared="$(cat ci-userland-path.txt)"
          mkdir -p ci-products
          python3 device/scripts/build-pong-userdata-image.py \
            --layout out/ipados18/ufs/ufs-layout.json \
            --header out/ipados18/ufs/shngroot-ipados18.bin \
            --output out/ipados18/ufs/pong-ipados18-userdata.img \
            --max-parts 20 \
            --part-max-mib 1900 \
            --delete-sources \
            --delete-root "${prepared}" \
            --json-out userdata-image.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          image = json.loads(Path('userdata-image.json').read_text())
          if image['image_bytes'] <= 0 or not image['parts']:
              raise SystemExit('the image builder wrote no parts')
          total = sum(part['bytes'] for part in image['parts'])
          if total != image['image_bytes']:
              raise SystemExit('the parts hold %d bytes, the image is %d' % (total, image['image_bytes']))
          print('userdata image', image['image_bytes'], 'bytes in', len(image['parts']), 'part(s)')
          Path('ci-products/userdata-image.json').write_text(json.dumps(image, indent=2) + '\n')
          Path('ci-products/ci-volume-layout.json').write_text(
              Path('ci-volume-layout.json').read_text())
          PY
          ls -l out/ipados18/ufs | tail -15
          df -h

      - name: Publish the parts as release assets
        # Assets are public and resumable: the phone host downloads them without
        # a token and concatenates them in order before flashing.
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "RMX3551 userdata (22H374)" \
              --notes "SHNGROOT userdata image parts for the RMX3551 iPadOS 18.7.10 bring-up. Concatenate in part order, then fastboot flash userdata."
          gh release upload "$tag" out/ipados18/ufs/pong-ipados18-userdata.img.part* ci-products/userdata-image.json ci-products/ci-volume-layout.json --clobber
          # The OS window prefix: what the phone host actually needs when only
          # the root changed.
          gh release upload "$tag" out/ipados18/ufs/pong-ipados18-oswindow.img.part* oswindow-image.json --clobber
          echo "assets:"
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
        env:
          GH_TOKEN: ${{ github.token }}
          # The checkout lives in device/, so the workspace root is not a git
          # repository and gh cannot infer the repo from it.
          GH_REPO: ${{ github.repository }}
