schema_version = 2

[board]
name = "rmx3551"
soc = "SM8475"
soc_source = "sm8475"
# The 22H374 profile ships in this repository at os-profiles/ and is installed into the
# UniXNU checkout before resolving (scripts/install-device-profile.py), because
# UniXNU/profiles/os/ has no 18.x profile yet.
os_profile = "ipados-18.7.10-22H374"
description = "realme GT2 Master Explorer (RMX3551): UniXNU UEFI bring-up"
kit = "rmx3551"

# iPadOS 18.7.10 restore selected from the matching J171 BuildIdentity.
[ipsw]
url = "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/140-97955/A3F72236-89AD-47C5-8394-5E824079C175/iPad_10.2_18.7.10_22H374_Restore.ipsw"
product = "iPad7,11"
version = "18.7.10"
build = "22H374"
device_class = "j171ap"
chip_id = 0x8010
board_id = 0x1c
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemOS", "Cryptex1,SystemTrustCache", "Cryptex1,AppOS", "Cryptex1,AppTrustCache", "OS"]

[components]
# This is the community Pong A730/QCA6490/Darwin24 implementation, not the A740/WCN7850 source.
# The kit lives in this repository at kits/PongPlatform24 and declares no archive recipe: the
# kernel step of this board builds the aggregate itself, see [kernel] below.
include = ["Rmx3551Platform24"]

[device_tree]
source = "device:dts/rmx3551.dts"
include_dirs = ["soc:dts"]

[kernel]
defconfig = "pong_ipados18_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8475.config", "os:configs/ipados.config"]
patch_series = ["device:migration/format2/arch-darwin24.series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu-ipados18/series"]
# Explicitly empty: an array here replaces the arch profile's list, and its
# archive builders produce the BCM2837 providers, not this board's aggregate.
archives = []
# The Darwin 24 aggregate is compiled with MACHINE_CONFIGS=PONG (config/MASTER.arm64.pong, added
# by patches/xnu-ipados18), not with the BCM2837 machine config the shared kernel step selects.
# Folding that into the shared step is open; see the packaging area of porting.toml.

# Local prelink and userdata entries are documented under migration/ipados18.
[kernel.prelink]
# The native aggregate the recipe leaves at this path, and the prelinker this
# board carried before the format 2 rewrite.
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_PONG/mach.development.pong"
# The slide is the one the 21H461 profile qualifies; this board's fixed base
# comes from the 22H374 storage bindings and is not yet expressed as a slide
# here. Until it is, scripts/package.sh is run with --skip-prelink and the
# boot image carries the native kernel (see the packaging area of porting.toml).
slide = "-0x1000000"
roots = ["com.apple.kec.corecrypto", "com.apple.kec.pthread", "com.apple.filesystems.apfs",
         "com.apple.kec.Compression", "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib"]
[firmware]
config = "rmx3551"
dsc = "Platforms/Realme/rmx3551Pkg/rmx3551.dsc"
fd = "Build/rmx3551Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# Runs in the build tree before the firmware build and writes the device tree the boot image
# carries; [bootimg] dtb names the same path.
preflight = ["scripts/build-pong-hardware-dtb.py"]
patches = [
  "Resources/MuPatches/AsmMacroLib.patch",
  "Resources/MuPatches/Auth-Service.patch",
  "Resources/MuPatches/Boot-Manager.patch",
  "Resources/MuPatches/Timer.patch",
  "Resources/MuPatches/Usb-Bus.patch",
]
packages = [
  "{uefi}",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot24",
  "{edk2}",
  "{uefi}/Platforms/Realme",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Realme",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "UniXNU-Pong"
PONG_INITRD_DISK_ENABLED = "1" # Set 0 to isolate SEC/HOB without the disk DXE.

[payload]
# The boot menu entry the firmware's DarwinBoot lists first, and the volume label of payload.img.
title = "RMX3551 iPadOS 18.7.10"
volume = "UNIXNU"
# 96 MiB, the --fat-mib a local run packs: PongBootMemoryDxe refuses an initrd
# above PONG_FAT_MAX_INITRD (128 MiB), and the 4096-byte PONGFAT1 header is
# inside the payload image the package step repacks, so the volume stays well
# below that bound.
size_mib = 96
# The original Apple trust caches travel in the payload (docs/concepts/security.md):
# StaticTrustCache and Cryptex1,SystemTrustCache from this IPSW, bundled by
# scripts/build-trust-bundle.py.  The payload step accepts the bundle only when
# its SHA-256 is listed here.
trust_cache_sha256 = ["cc4f5079fafbb81cf32f54718666461630381972867428e13c6e8a906b58d7cd"]
# The current runtime arguments this board brings up with: the ones scripts/build-ipados18-prelinked-boot.py
# used to write, minus its boot-epoch (the ADT carries a software clock instead) and with the
# applog list trimmed to the services the trace reads. DarwinBoot copies the line into a
# 1024-byte buffer and refuses more than 1000 bytes; keep the final assembled line within1023 bytes.
kernel_args = [
  # Verbose boot: without it XNU initialises the framebuffer console but prints
  # nothing, which is indistinguishable from a hang on a board with no serial.
  "-v",
  # The documented on-screen diagnostic page: it draws its own overlay into the
  # XNU framebuffer mapping, so it works before the text console is alive.
  "boot-progress=1",
  # kalloc_type splits this budget 70/30 between signature and type zones
  # and asserts that one size class never needs 32 of them.  The CI profile
  # compiles far fewer kalloc_type users than the shipping one, so the
  # default budget (120) concentrates in a single class and panics; 24 keeps
  # every class under the bound.
  # arm64 has 29 size classes and each needs at least 2 signature zones, so the
  # signature share (7/10 of the budget) must reach 58 - below that the kernel
  # asserts "remaining_zones >= min_sig".  The type share (3/10) must in turn
  # stay under 29, or a single class exceeds the 32-zone array.  83 is the only
  # value that satisfies both: 58 signature zones, 25 type zones.
  "kt_fixed_zones=83",
  "keepsyms=1",
  "cpus=1",
  "pong_allow_unauthenticated_root=1",
  "cs_enforcement_disable=1",
  "cs_library_val_enable=0",
  "amfi_get_out_of_my_way=1",
  "-apfs_shared_datavolume",
  "debug=0x14e",
  "serial=0",
  "pong_disable_swap=1",
  "pong_skip_setup=1",
  "pong_adsp=2",
  "pong_audio=2",
  "pong_ufs_readwrite=1",
  # Mirror the kernel console into the spare tail of userdata every 10 s so a
  # recovery reader can pull the log after a panic. See
  # drivers/NativeUfs/PongBootLog.h.
  "pong_bootlog=1",
  "ignition_level=1",
  "dyld_flags=0x8",
  # launchd_rd=md0 was the reference port's ramdisk handoff: it makes launchd
  # treat the boot as a restore environment and re-exec launchd_cache_loader,
  # which aborts on a root that has no dyld cache of its own.  This board's root
  # and Data are on UFS, so the flag is gone.
  "pong_init_trace=1",
  "pong_software_keybag=1",
  "pong_display=1",
  "pong_software_ui=1",
  "pong_ui_software=1",
  "pong_touch=1",
  "pong_buttons=1",
  "pong_init_path=/pong/init",
  "pong_build=ipados18-22H374",
  "pong_gpu_scanout=1",
  "pong_gpu_pool_mib=0",
  "pong_metal_global=1",
  "pong_gpu_lock_max=1",
  "pong_usb=1",
  "pong_usb_mux=1",
  "pong_usb_iphone=1",
  "pong_rootful=1",
  # The stock loader refuses a launchd.plist that does not match the factory
  # signature and exits, which the kernel treats as a fatal child and panics on
  # (launchd_cache_loader[22] exited -- -67062 errSecCSUnsigned). This is the
  # loader's own development switch: it accepts the locally adapted cache and
  # stops pairing the modified plist with the stock signature.
  "launchd_unsecure_cache=1",
  # SpringBoard no longer traps on the display mode, but the console then only
  # shows wifip2pd restarting: nothing says whether the compositor ever asks the
  # framebuffer for anything. fbtrace logs the first calls of every IOMFB
  # selector, surftrace the first surfaces and what becomes of them, both from
  # the port's own frame diagnostics.
  "fbtrace=8",
  "surftrace=24",
  # The kernel console only carries what the kernel prints; SpringBoard's own
  # reasons live in os_log, which is why a stalled home screen says nothing.
  # These two mirror the named processes' logs into the console -- the same pair
  # and the same list the reference port boots with, and the reason it could
  # read a wait chain where this board only saw wifip2pd restarting.
  "applog=1",
  "applog_name=launchd,backboardd,SpringBoard,containermanagerd,lsd,runningboardd,logd_helper,powerd",
  # The writable Data mount is gated on the owner cache being authorized and the
  # root device being verified: native_owner_data_prepare returns ENXIO at its
  # first check (stage 0) when either is false, and /private/var then stays on the
  # read-only root, which is where launchd dies.  Both switches are the ones the
  # upstream documents name for this pipeline and neither was in this list:
  # offline-owner-root-check starts the verified root probe, native-ufs-root is
  # the UFS runtime argument the storage page requires.
  "offline-owner-root-check=1",
  "native-ufs-root=1",
]

[payload.adt]
# schema_version 2 builds the ADT from the hardware DTS through devicetree.generate(); these keys
# are the ones that function reads from [payload.adt]. The DarwinBoot allocation window is 4 GiB,
# the window the first bring-up boot used.
owned_memory_size = "0x100000000"
# The restore's own disk images are used unmodified, so /chosen/RAMDisk holds only the seed; the
# three volumes come from the userdata image and XNU mounts them through the UFS root driver.
packed_data_ramdisk = false
# The seed is not stored in any repository: scripts/package.sh takes it from UNIXNU_UNIQUE_CHIP_ID.
unique_chip_id = "required"
# The J171 BuildIdentity's chip ID, the same value [ipsw] carries.
chip_id = "0x8010"
# Root selection (docs/guide/userdata.md "Root selection"): the kernel mounts the
# volume whose UUID the /chosen/root-matching dictionary names.  This is the OS
# volume inside the userdata image this board installs (role 1, "system"),
# read back from the flashed image with tools/apfs.
root_match_volume_uuid = "B07DF049-7AD9-47B5-9F8F-9EE728056398"

[userdata]
# The userdata partition this board installs into, in 4 KiB sectors, read from the
# device's own GPT (docs/guide/userdata.md: "first_lba and last_lba come from the
# GPT entry named userdata on the device").  The reference port's pair
# (0x413248..0x75A40EA, a 512 GB unit) describes a different capacity and made
# every 256 GB unit fail the driver's geometry check.
#
#   0x2B52EC .. 0x3AA97FA  *  4096  =  240,321,506,304 bytes (223.8 GiB)
first_lba = 0x2B52EC
last_lba = 0x3AA97FA
lba_bytes = 4096
# The windows of the userdata image are the OS and SystemOS disk images of the IPSW, in
# that order; the OS profile lists them ([userdata] windows of
# os-profiles/ipados-18.7.10-22H374/profile.toml), because they are the profile's
# components. This table adds only what belongs to the device.

[package]
# The UniXNU checkout, relative to this repository: scripts/package.sh reads it.
unixnu = "../UniXNU"

[package.defconfig]
"ipados-18.7.10-22H374" = "pong_ipados18_defconfig"

[bootimg]
# Compiled by scripts/build-pong-hardware-dtb.py at the firmware preflight step, relative to the
# build tree (docs/porting/packaging.md).
dtb = "build/pong/pong.dtb"

[bootimg.image]
# Resources/Configs/pong.toml in the firmware records the Android build system's v4, but unixnu
# packs and verifies v0-v2 headers only: verify() reads header_version and pagesize at the v0/v1/v2
# offsets and a v4 header carries them elsewhere. This header therefore describes boot/boot.img,
# the spec product whose ramdisk is the bare payload.img. The flashable v4 image the firmware
# accepts is boot/pong-xnu-initial.img, written by scripts/finalize-pong-adt.py with the same
# container the local flow produces; see the payload section above.
header_version = 0
pagesize = 4096
