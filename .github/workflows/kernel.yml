name: RMX3551 kernel build

# Runner note (2026-11-05): the hosted-macOS shortage was a queue problem, not
# a repository problem - macos-15-intel and macos-14 both acquire a machine in
# seconds, macos-latest (the newer pool) is the one that stalls.  Keep the pin.
#
# Kernel only.  No IPSW, no userdata image, no firmware: this job exists to
# answer one question - does the format2 configuration resolve far enough to
# compile a Darwin 24 kernel for this board.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner label. The packaging notes pin macos-15-intel; macos-latest is the arm64 fallback when that pool is out of capacity.'
        required: false
        default: macos-15-intel
  push:
    paths:
      - 'board.toml'
      - 'dts/**'
      - 'configs/**'
      - 'kits/**'
      - 'patches/**'
      - 'migration/**'
      - 'feeds.toml'
      - 'unixnu.lock'
      - 'scripts/**'
      - '.github/workflows/kernel.yml'

permissions:
  # write is for the ci-logs branch only: artifacts and job logs need a token
  # to download, so the build log is committed back instead.
  contents: write

jobs:
  kernel:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 360
    env:
      # scripts/pong_paths.py falls back to /Volumes/PongDev and
      # /Volumes/Untitled/Pong-iPadOS18, the author's external disks.  Both
      # accept an override, so point them inside the runner workspace.
      PONG_WORK_ROOT: ${{ github.workspace }}/pong-work
      PONG_ROOT: ${{ github.workspace }}/pong-work
      PONG_INPUT_ROOT: ${{ github.workspace }}/pong-inputs
      # The kernel bakes three APFS volume UUIDs in as constants.  Without a
      # userdata image there is nothing to read them from, so a fixed uuid5
      # placeholder stands in - enough to compile and link, mounts nothing.
      PONG_VOLUME_LAYOUT: ${{ github.workspace }}/device/configs/ci-volume-layout.placeholder.json
    steps:
      - name: Checkout device repo with driver submodules
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
          fetch-depth: 1

      - name: Let the USB console start without the audio classes
        # PongPower gates PongUsb::start() on pong_audio_service_classes_ready(),
        # so a board whose audio meta-classes failed gets no USB console and no
        # diagnostic explaining why. The transport needs nothing from audio, and
        # on this board the CDC console is the only live log channel there is.
        # The driver is a pinned submodule, so the edit is applied to the
        # checkout; the step stops the build if the expected line is gone.
        run: |
          set -euo pipefail
          python3 device/scripts/loosen-pong-usb-gate.py \
            --source device/drivers/PongPower/PongPower.cpp

      - name: Instrument the USB transport
        # Its handoff/PMIC lines print once, seconds before launchd floods the
        # console, so a photo of a later panic cannot show them. This adds an
        # entry line, the handoff/DMA/PHY results, and a 96-second status
        # reprint so the last screen always carries the USB state.
        run: |
          set -euo pipefail
          python3 device/scripts/instrument-pong-usb.py \
            --source device/drivers/PongUsb/PongUsbDevice.h

      - name: Checkout UniXNU toolchain
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          # The revision the format2 migration notes pin for this branch.
          ref: 0fc0fc1f9ddd0fbd4787738afef38667df5e0a95
          path: tools
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Toolchain check
        run: |
          set -euo pipefail
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install dtc >/dev/null 2>&1 || true
          # scripts/decompress-ipados18-kernelcache.py shells out to the lzfse
          # CLI and refuses to run without it.
          brew install lzfse >/dev/null 2>&1 || true
          # The payload step writes its FAT volume with mformat/mcopy.
          brew install mtools >/dev/null 2>&1 || true
          dtc --version
          lzfse -h 2>&1 | head -1
          mformat --version 2>&1 | head -1
          python3 --version

      - name: Fetch the pinned Apple and board sources
        # feeds.toml lists six Apple-OSS repositories; configs/pong-native-sources.toml
        # adds four board prerequisites.  The script fetches each pin with
        # --depth 1, so even the linux tree only costs one commit.
        working-directory: device
        run: |
          set -euo pipefail
          python3 scripts/fetch-pong-native-sources.py

      - name: Cache the pinned Apple components
        # The restore is ~7.8 GB and the component extraction is a partially
        # ranged download over it.  Cache the result so a follow-up run only
        # pays for the compile.
        id: components
        uses: actions/cache@v4
        with:
          path: device/apple/ipados18-22H374
          key: ipados18-22H374-components-v1

      - name: Extract the pinned Apple components
        # The kernel build reads kernelcache/DeviceTree/TrustCache out of the
        # restore, at device/apple/<os-profile>/components/.  Only those three
        # are fetched: the full userdata image is a separate, much heavier job.
        if: steps.components.outputs.cache-hit != 'true'
        working-directory: device
        run: |
          set -euo pipefail
          python3 scripts/prepare-ipados18-components.py \
            --remote \
            --output-dir apple/ipados18-22H374 \
            --only KernelCache --only DeviceTree --only StaticTrustCache
          # prepare-ipados18-components.py stores the raw IM4P; the UFS binder
          # and the prelinked boot both read the LZFSE payload inside it, under
          # a directory of the same name.  This is the step that produces it.
          python3 scripts/decompress-ipados18-kernelcache.py \
            --im4p apple/ipados18-22H374/components/kernelcache.release.ipad7c \
            --output apple/ipados18-22H374/components/kernelcache.release.ipad7c.decompressed/kernelcache.release.ipad7c.decompressed
          ls -l apple/ipados18-22H374/components/

      - name: Resolve configuration and build the kernel
        working-directory: device
        # The wrapper used to drop every XNU_ variable it inherited, keeping only
        # what the generated .config carries -- and that file has no line for the
        # board symbols, so the power archive was never built.  It now keeps them;
        # export the one this board needs and echo it so the log proves it went in.
        env:
          XNU_PONG_POWER: '1'
          # The generated .config drops this switch and the Kconfig default is on,
          # so the build enters the source-corecrypto branch and stops at
          # test -f $CRYPTO_ARCHIVE -- an archive this build never produces.
          # 22H374 takes its crypto from the prelinked component instead.
          XNU_SOURCE_CORECRYPTO14: '0'
        run: |
          set -euo pipefail
          echo "XNU_PONG_POWER=${XNU_PONG_POWER:-<unset>}"
          mkdir -p "${PONG_WORK_ROOT}" "${PONG_INPUT_ROOT}"
          # The README is explicit: the shipping defconfig needs Wi-Fi, backlight
          # and Adreno stages whose firmware this public repository does not
          # carry, so hosted builds select the ci variant instead.
          # tee so the failure has a log even when the crash happens before the
          # inner build script writes one (a bad defconfig name, for instance).
          python3 scripts/build-pong-format2.py \
            --unixnu ../tools \
            --out ../build \
            --jobs 4 \
            --defconfig pong_ipados18_ci_defconfig 2>&1 \
            | tee "${GITHUB_WORKSPACE}/build-driver.log"

      - name: Report whether the board components reached the kernel
        # A boot with pong_usb=1 produced no USB line at all, and the kernel
        # carried the touch strings but neither "audio classes ready" (added by
        # the step above) nor any pong-power object.  Say out loud what the
        # build produced, so the next round reads an answer instead of a guess.
        run: |
          set -uo pipefail
          KERNEL=$(find . -name 'kernel.macho' -o -name 'kernel-ipados18.macho' | head -1)
          echo "kernel: ${KERNEL:-<missing>}"
          echo "--- pong-power archive ---"
          find . -name 'libPongPower.a' -o -name 'pong-power' -type d | sed 's/^/  /' | head
          for symbol in "audio classes ready" "Pong touch: Berlin-D ready" "pong_power_start_optional"; do
            if [ -n "${KERNEL}" ] && grep -qa "$symbol" "$KERNEL"; then
              echo "  present: $symbol"
            else
              echo "  MISSING: $symbol"
            fi
          done

      - name: Prelink the Apple kexts into the kernel
        # A source build alone is not a bootable kernel: the Apple kexts and
        # platform services live in the original kernelcache, and IOKit's C++
        # runtime faults in OSMetaClass::postModLoad without them.  This mirrors
        # scripts/build-ipados18-prelinked-boot.py: the kernelcache is a fat
        # image, so it is sliced to a thin arm64 Mach-O first, and that thin
        # file is what emit_prelink.py expects for --prelinked.
        working-directory: device
        run: |
          set -euo pipefail
          bindings=$(find . ../build -name bindings.json -path '*native-ufs*' 2>/dev/null | head -1)
          echo "bindings: ${bindings:-<none>}"
          if [ -z "${bindings}" ]; then
            echo "no storage bindings found; candidates:"
            find . ../build -name bindings.json 2>/dev/null | head -5
            exit 1
          fi
          cache=apple/ipados18-22H374/components/kernelcache.release.ipad7c.decompressed/kernelcache.release.ipad7c.decompressed
          native=$(find ../build -path '*/kernel/mach.development.pong' -type f | head -1)
          out=$(dirname "$native")/kernel.macho
          echo "native: ${native}"
          thin=$(mktemp -t prelinked).macho
          slide=$(python3 - "$bindings" "$cache" "$thin" <<'PY_SLIDE'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'kits/NativePrelink')
          from native_prelink import arm64_image, macho
          from emit_prelink import COALESCED
          board = json.loads(Path(sys.argv[1]).read_text())
          raw = Path(sys.argv[2]).read_bytes()
          thin = arm64_image(raw)
          Path(sys.argv[3]).write_bytes(thin)
          image = macho(thin)
          base = min(s['va'] for s in image['segments'] if s['name'] in COALESCED and s['size'])
          print(hex(int(board['fixed_prelink_base'], 16) - base))
          PY_SLIDE
          )
          echo "slide: ${slide}  thin: $(stat -f%z "$thin") bytes"
          python3 kits/NativePrelink/emit_prelink.py \
            --kernel "$native" \
            --prelinked "$thin" \
            --slide "$slide" \
            --output "$out" \
            --root com.apple.kec.corecrypto \
            --root com.apple.kec.pthread \
            --root com.apple.filesystems.apfs \
            --root com.apple.kec.Compression \
            --root com.apple.AppleFSCompression.AppleFSCompressionTypeZlib \
            2>&1 | tee -a "${GITHUB_WORKSPACE}/build-driver.log"
          ls -l "$out"

      - name: Keep Apple's CPU driver out of the boot path
        # apfs -> AppleARMWatchdogTimer -> AppleARMPlatform drags that kext into
        # the prelink, and its AppleARMCPU personality (IONameMatch "cpu")
        # attaches to the /cpus nubs and panics on a Qualcomm ADT.  ArmCpu is
        # this board's CPU driver; the kext stays for its symbols, only the
        # match string is renamed.
        working-directory: device
        run: |
          set -euo pipefail
          kernel=$(find ../build -path '*/kernel/kernel.macho' -type f | head -1)
          python3 scripts/pong-prelink-prune-personality.py "$kernel"

      - name: Build the boot payload volume
        # Stage 3->4: the FAT volume UniXNU reads (kernel, ADT, trust caches,
        # config).  The trust caches are the IPSW's own StaticTrustCache and
        # Cryptex1,SystemTrustCache modules: the original AppleImage4/AMFI
        # components verify the sealed system binaries and the dyld shared cache
        # against them (docs/concepts/security.md), and without them launchd's
        # cache loader aborts with "Failed to verify code directory".
        working-directory: device
        run: |
          set -euo pipefail
          # The kernel step names its output mach.development.pong, while the
          # payload step defaults to kernel/kernel.macho: point it at the file.
          kernel=$(find ../build -path '*/kernel/kernel.macho' -type f | head -1)
          if [ -z "$kernel" ]; then
            kernel=$(find ../build -path '*/kernel/mach.*' -type f | head -1)
          fi
          echo "payload kernel: ${kernel}"
          python3 scripts/prepare-ipados18-components.py --remote \
            --only StaticTrustCache --only 'Cryptex1,SystemTrustCache' \
            --output-dir apple/ipados18-22H374 2>&1 | tail -3
          caches=(apple/ipados18-22H374/components/Firmware/*.trustcache)
          echo "trust modules: ${caches[*]}"
          python3 scripts/build-trust-bundle.py --output ../build/trust/rmx3551-trust.bundle "${caches[@]}"
          python3 ../tools/unixnu build payload \
            -D . --out ../build --kernel "$kernel" \
            --unique-chip-id 0x0123456789abcdef \
            --trust-cache ../build/trust/rmx3551-trust.bundle 2>&1 \
            | tee -a "${GITHUB_WORKSPACE}/build-driver.log"
          find ../build -name 'payload.img' -exec ls -l {} \;

      - name: Show the build script around the failing line
        # The failing test is reported at line 953 of the script inside the build
        # tree, while the same test sits at line 771 of the device copy, so the
        # tree script is not byte-identical.  Print the region before guessing.
        if: failure()
        run: |
          SCRIPT=$(find . -path '*tree/scripts/build-xnu-ipados18.sh' | head -1)
          echo "script: ${SCRIPT:-<missing>}"
          [ -n "$SCRIPT" ] && sed -n '935,965p' "$SCRIPT"
          echo "--- variables ---"
          grep -a -E 'XNU_SOURCE_CORECRYPTO14|XNU_PONG_POWER|CRYPTO_ARCHIVE' "${GITHUB_WORKSPACE}/kernel-build.log" 2>/dev/null | tail -20

      - name: Show the XNU build log when the kernel fails
        # build-ipados18-pong-macos.py only prints the path of the log it keeps,
        # and that path dies with the runner.  The tree name and the file name
        # both vary (Pong-iPadOS18-native/build-<utc>.log today), so search.
        if: failure()
        run: |
          set +e
          # Start from the driver's own output: it exists even when the failure
          # happened before any XNU log was written.
          out="${GITHUB_WORKSPACE}/kernel-build.log"
          cp "${GITHUB_WORKSPACE}/build-driver.log" "$out" 2>/dev/null || : > "$out"
          # Why the link still misses a symbol is usually a config that never
          # reached the .config, so record what the profile actually resolved to.
          {
            echo '===== resolved config ====='
            cfg=$(find "${GITHUB_WORKSPACE}/build" -maxdepth 5 -name .config 2>/dev/null | head -1)
            echo "$cfg"
            grep -E 'XNU_(PONG_POWER|NATIVE_UFS|PONG_WIFI|PONG_ADRENO_PLATFORM|ARMCPU|ARM_DT_PLATFORM)=' "$cfg" 2>/dev/null
            echo '===== pong-power archive ====='
            find "${PONG_WORK_ROOT}" -maxdepth 4 -type d -name pong-power 2>/dev/null | head -3
            find "${PONG_WORK_ROOT}" -maxdepth 5 -name 'libPongPower.a' -exec ls -l {} \; 2>/dev/null | head -3
          } 2>&1 | tee -a "$out"
          log=$(find "${PONG_WORK_ROOT}" -maxdepth 3 -type f -name 'build-*.log' 2>/dev/null | sort | tail -1)
          if [ -z "${log}" ]; then
            log=$(find "${PONG_WORK_ROOT}" -type f -name '*.log' 2>/dev/null | sort | tail -1)
          fi
          if [ -n "${log}" ]; then
            echo "===== ${log} ====="
            echo "===== ${log} =====" >> "$out"
            # The interesting line is usually not in the tail, so show both the
            # tail and every error the build printed.
            tail -400 "${log}" | tee -a "$out"
            echo "===== error lines =====" | tee -a "$out"
            grep -n -E "error:|Error |FAILED|failed|not found|No such file" "${log}" | tail -80 | tee -a "$out"
          else
            echo 'no XNU log was produced under '"${PONG_WORK_ROOT}" | tee -a "$out"
            find "${PONG_WORK_ROOT}" -maxdepth 4 -type d 2>/dev/null | head -40 | tee -a "$out"
          fi

      - name: Publish the build log to the ci-logs branch
        # Job logs and artifacts both require a token to download.  Pushing the
        # log to a throwaway branch keeps the failure readable from a plain
        # `git fetch`, which is the only channel available without a PAT.
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          src="${GITHUB_WORKSPACE}/kernel-build.log"
          [ -f "$src" ] || { echo 'no kernel-build.log to publish'; exit 0; }
          rm -rf "${RUNNER_TEMP}/ci-logs"
          git init -q "${RUNNER_TEMP}/ci-logs"
          cd "${RUNNER_TEMP}/ci-logs"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Full fetch, not --depth 1: a shallow clone cannot push over a
          # complete remote branch ("shallow update not allowed").
          if git fetch -q origin ci-logs 2>/dev/null; then
            git checkout -q -B ci-logs FETCH_HEAD
          else
            git checkout -q --orphan ci-logs
            git rm -rq --cached . 2>/dev/null || true
          fi
          mkdir -p runs
          cp "$src" "runs/${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}.log"
          printf '%s\n' "${GITHUB_RUN_ID} ${GITHUB_SHA::8} ${GITHUB_JOB} $(date -u +%FT%TZ)" > runs/index.txt
          git add -A
          git -c user.name='ci' -c user.email='ci@users.noreply.github.com' \
              commit -q -m "log: run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" || true
          git push -q --force origin ci-logs
          echo "published runs/${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}.log"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmx3551-kernel
          path: |
            build/**/resolved-profile.json
            build/**/*_FORMAT2_RESULT.json
            build/**/hardware.dtb
            build/**/kernel/*
            build/**/payload/*
            kernel-build.log
          if-no-files-found: warn
          retention-days: 7
