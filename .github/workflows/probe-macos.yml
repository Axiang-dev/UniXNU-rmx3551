name: macOS runner probe

# Throwaway: answers one question - can this repository still acquire a
# GitHub-hosted macOS runner, and which label actually gets one?
# Delete once the kernel build runs again.
on:
  workflow_dispatch:
    inputs:
      runner:
        required: false
        default: macos-latest
  push:
    paths:
      - '.github/workflows/probe-macos.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Say hello
        run: |
          uname -a
          xcode-select -p
          sw_vers
          echo "runner label was: ${{ matrix.runner }}"
